[project]
name = "sakbe"
version = "0.1.0"
description = "SakbeLab: open source network emulator backend, CLI and Python SDK"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
# The SDK and CLI only need PyYAML; the server adds the [server] extra.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
dev = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
sakbe = "sakbe.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sakbe*"]

[tool.setuptools.package-data]
sakbe = ["web/*", "web/assets/*"]

[tool.ruff]
line-length = 100
