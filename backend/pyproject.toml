[project]
name = "sakbe"
version = "0.0.2"
description = "SakbeLab: open source network emulator backend, CLI and Python SDK"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
sakbe = "sakbe.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sakbe*"]

[tool.setuptools.package-data]
sakbe = ["web/*", "web/assets/*"]

[tool.ruff]
line-length = 100
