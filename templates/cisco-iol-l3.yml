# Plantilla de ejemplo. La imagen NO se incluye: cada usuario carga la suya.
id: cisco-iol-l3
name: Cisco IOL L3
vendor: Cisco
engine: iol
icon: router
defaults:
  ram: 512
  cpus: 1
interfaces:
  count: 4
  naming: "Ethernet{slot}/{port}"
  ports_per_slot: 4
console:
  type: telnet
config:
  day0: nvram
